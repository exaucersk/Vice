name: vice-share
services:
  vice-share:
    build:
      context: ../..
      dockerfile: deploy/share-host/Dockerfile
    image: vice-share:local
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://gclips.kimonima.de}
      NEXTCLOUD_BASE_URL: ${NEXTCLOUD_BASE_URL:?Run init_env.py with your Nextcloud URL first}
      VICE_SHARE_API_TOKEN: ${VICE_SHARE_API_TOKEN:?Run init_env.py first}
      NEXTCLOUD_MEDIA_MODE: ${NEXTCLOUD_MEDIA_MODE:-dav}
      DATABASE_PATH: /data/clips.sqlite3
    volumes:
      - share-data:/data
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8787}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  share-data:
